# Runs daily around 8:30 AM America/New_York even when system is offline.

name: Daily job matches email

on:
  schedule:
    - cron: "30 16 * * *"   # TESTING // will revert to~8:30 AM EDT
  workflow_dispatch:        

jobs:
  find-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate — run in 8 AM Eastern hour (or always if manual)
        id: gate
        run: |
          et_hm=$(TZ=America/New_York date +%H:%M)
          et_hour=$(TZ=America/New_York date +%H)
          echo "Eastern time now: $et_hm (event=${{ github.event_name }})"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$et_hour" = "12" ]; then
            # Matches cron "30 16" (16:30 UTC = 12:30 PM EDT). Change to "08" when reverting to 8:30 AM ET.
            echo "Within 12 PM ET hour — proceeding (GitHub cron may be a few minutes late)."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: want 12 PM ET hour, got $et_hm (heavy delay or wrong slot)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        run: uv python install 3.13

      - name: Write secrets to .env and resume.txt
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESUME_TXT: ${{ secrets.RESUME_TXT }}
          DAILY_COMPANIES: ${{ secrets.DAILY_COMPANIES }}
          DAILY_TITLE_KEYWORDS: ${{ secrets.DAILY_TITLE_KEYWORDS }}
          DAILY_MIN_SCORE: ${{ secrets.DAILY_MIN_SCORE }}
          DAILY_MAX_JOBS: ${{ secrets.DAILY_MAX_JOBS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          required = ["ANTHROPIC_API_KEY", "GMAIL_ADDRESS", "GMAIL_APP_PASSWORD", "EMAIL_TO", "RESUME_TXT"]
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit(f"Missing GitHub secrets: {', '.join(missing)}")

          env_lines = [
              f"ANTHROPIC_API_KEY={os.environ['ANTHROPIC_API_KEY']}",
              f"GMAIL_ADDRESS={os.environ['GMAIL_ADDRESS']}",
              f"GMAIL_APP_PASSWORD={os.environ['GMAIL_APP_PASSWORD']}",
              f"EMAIL_TO={os.environ['EMAIL_TO']}",
              f"DAILY_COMPANIES={os.environ.get('DAILY_COMPANIES') or 'databricks,stripe'}",
              f"DAILY_TITLE_KEYWORDS={os.environ.get('DAILY_TITLE_KEYWORDS') or 'data engineer'}",
              f"DAILY_MIN_SCORE={os.environ.get('DAILY_MIN_SCORE') or '60'}",
              f"DAILY_MAX_JOBS={os.environ.get('DAILY_MAX_JOBS') or '5'}",
          ]
          Path(".env").write_text("\n".join(env_lines) + "\n")
          Path("resume.txt").write_text(os.environ["RESUME_TXT"])
          print("Wrote .env and resume.txt")
          PY

      - name: Install deps and run daily job
        if: steps.gate.outputs.run == 'true'
        run: uv run python run_daily.py
