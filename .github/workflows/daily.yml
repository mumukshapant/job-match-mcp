# Runs once a day whenever GitHub delivers the schedule (no time gate — late is OK).

name: Daily job matches email

on:
  schedule:
    - cron: "30 12 * * *"   # ~once daily; GitHub may start late — job still runs
  workflow_dispatch:

jobs:
  find-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Write secrets to .env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESUME_TXT: ${{ secrets.RESUME_TXT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAILY_COMPANIES: ${{ secrets.DAILY_COMPANIES }}
          DAILY_TITLE_KEYWORDS: ${{ secrets.DAILY_TITLE_KEYWORDS }}
          DAILY_MIN_SCORE: ${{ secrets.DAILY_MIN_SCORE }}
          DAILY_MAX_JOBS: ${{ secrets.DAILY_MAX_JOBS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          required = [
              "ANTHROPIC_API_KEY",
              "BRAVE_API_KEY",
              "GMAIL_ADDRESS",
              "GMAIL_APP_PASSWORD",
              "EMAIL_TO",
              "RESUME_TXT",
              "DATABASE_URL",
          ]
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit(f"Missing GitHub secrets: {', '.join(missing)}")

          def env_value(value: str) -> str:
              # Resumes have newlines. A raw RESUME_TXT=line1\nline2 (real newlines) would
              # break .env parsing. Values are double-quoted with \n / \" escaped so dotenv
              # can load the full resume as one string. Same quoting for other string
              # secrets for consistency.
              escaped = (
                  value.replace("\\", "\\\\")
                  .replace('"', '\\"')
                  .replace("\n", "\\n")
                  .replace("\r", "\\r")
              )
              return f'"{escaped}"'

          env_lines = [
              f"ANTHROPIC_API_KEY={env_value(os.environ['ANTHROPIC_API_KEY'])}",
              f"BRAVE_API_KEY={env_value(os.environ['BRAVE_API_KEY'])}",
              f"GMAIL_ADDRESS={env_value(os.environ['GMAIL_ADDRESS'])}",
              f"GMAIL_APP_PASSWORD={env_value(os.environ['GMAIL_APP_PASSWORD'])}",
              f"EMAIL_TO={env_value(os.environ['EMAIL_TO'])}",
              f"RESUME_TXT={env_value(os.environ['RESUME_TXT'])}",
              f"DATABASE_URL={env_value(os.environ['DATABASE_URL'])}",
              f"DAILY_COMPANIES={env_value(os.environ.get('DAILY_COMPANIES') or 'databricks,stripe')}",
              f"DAILY_TITLE_KEYWORDS={env_value(os.environ.get('DAILY_TITLE_KEYWORDS') or 'data engineer')}",
              f"DAILY_MIN_SCORE={os.environ.get('DAILY_MIN_SCORE') or '60'}",
              f"DAILY_MAX_JOBS={os.environ.get('DAILY_MAX_JOBS') or '5'}",
          ]
          Path(".env").write_text("\n".join(env_lines) + "\n")
          print("Wrote .env")
          PY

      - name: Install deps and run daily job
        run: |
          echo "Eastern time now: $(TZ=America/New_York date)"
          uv run python run_daily.py
